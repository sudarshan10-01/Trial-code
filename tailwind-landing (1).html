<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailwind — Fly home more, spend less.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F5F1E8;
    --card: #FFFFFF;
    --border: #E7E1D2;
    --ink: #1E1D1B;
    --ink-soft: #55524A;
    --muted: #948E7E;
    --pill-off-border: #DDD7C7;
    --coral: #E8734C;
    --coral-dark: #D5613B;
    --focus: #1E1D1B;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 40px;
  }

  /* ---------- Nav ---------- */
  .nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 34px 0 10px;
    opacity: 0;
    animation: fadeDown .6s ease forwards;
  }
  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand svg{ display:block; }
  .brand span{
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.22em;
  }
  .nav-links{
    display: flex;
    align-items: center;
    gap: 36px;
  }
  .nav-links a{
    color: var(--ink);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
    position: relative;
    padding-bottom: 3px;
  }
  .nav-links a::after{
    content:'';
    position: absolute;
    left: 0; right: 100%;
    bottom: 0;
    height: 1.5px;
    background: var(--ink);
    transition: right .25s ease;
  }
  .nav-links a:hover::after{ right: 0; }

  .btn-app{
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 12px 22px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn-app:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(30,29,27,0.25);
  }
  .btn-app:active{ transform: translateY(0); }

  /* ---------- Hero ---------- */
  .hero{ padding: 56px 0 90px; }
  h1{
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 6vw, 64px);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 46px;
    opacity: 0;
    transform: translateY(16px);
    animation: riseIn .7s cubic-bezier(.2,.7,.2,1) .12s forwards;
  }

  .cards{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
    align-items: stretch;
  }
  @media (max-width: 860px){
    .cards{ grid-template-columns: 1fr; }
  }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    opacity: 0;
    transform: translateY(20px) scale(.98);
    animation: riseIn .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .card.illustration-card{
    padding: 40px 40px 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    animation-delay: .28s;
  }
  .card.form-card{
    padding: 42px 44px 40px;
    animation-delay: .42s;
  }

  /* ---------- Illustration card ---------- */
  .carousel{
    position: relative;
    width: 100%;
    height: 240px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .carousel img{
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    animation: kenburns 14s ease-in-out infinite;
    transition: opacity .5s ease;
  }
  .caption{
    margin: 18px 0 22px;
    text-align: center;
    font-size: 15px;
    color: var(--ink-soft);
    line-height: 1.5;
    min-height: 46px;
    transition: opacity .35s ease;
  }
  .dots{
    display: flex;
    gap: 8px;
  }
  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background .25s ease, transform .25s ease;
  }
  .dot.active{
    background: var(--ink);
    transform: scale(1.25);
  }

  /* ---------- Form card ---------- */
  .form-card h2{
    font-family: 'Manrope', sans-serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 6px;
  }
  .form-card .sub{
    margin: 0 0 26px;
    color: var(--muted);
    font-size: 14.5px;
  }

  .field-group{ margin-bottom: 22px; }
  .field-group > label{
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: capitalize;
    margin-bottom: 12px;
  }

  .radio-row{
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
  }
  .radio{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
  }
  .radio input{ display:none; }
  .radio .dotring{
    width: 16px; height:16px;
    border-radius: 50%;
    border: 1.5px solid var(--pill-off-border);
    position: relative;
    transition: border-color .2s ease;
    flex-shrink: 0;
  }
  .radio .dotring::after{
    content:'';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--ink);
    transform: scale(0);
    transition: transform .18s cubic-bezier(.4,0,.2,1);
  }
  .radio input:checked + .dotring{ border-color: var(--ink); }
  .radio input:checked + .dotring::after{ transform: scale(1); }

  .pill-row{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .pill{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--pill-off-border);
    background: #fff;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .15s ease;
  }
  .pill:hover{ transform: translateY(-1px); }
  .pill.active{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .pill svg{ width: 15px; height: 15px; }

  hr.divider{
    border: none;
    border-top: 1px solid var(--border);
    margin: 26px 0;
  }

  .to-from{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 8px;
  }
  .to-from label{
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .to-from input{
    width: 100%;
    padding: 13px 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .to-from input:focus{
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(30,29,27,0.08);
  }

  .trust{
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    margin: 26px 0 20px;
  }

  .cta{
    width: 100%;
    background: var(--coral);
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 999px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .cta:hover{
    background: var(--coral-dark);
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(232,115,76,0.35);
  }
  .cta:active{ transform: translateY(0); }
  .cta svg{ transition: transform .18s ease; }
  .cta:hover svg{ transform: translateX(3px); }

  /* ---------- Keyframes ---------- */
  @keyframes fadeDown{
    from{ opacity:0; transform: translateY(-10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes riseIn{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes kenburns{
    0%{ transform: scale(1) translateY(0); }
    50%{ transform: scale(1.035) translateY(-4px); }
    100%{ transform: scale(1) translateY(0); }
  }
</style>
</head>

<script>
  // Single-select pill groups
  document.querySelectorAll('[data-select-group]').forEach(group=>{
    group.querySelectorAll('.pill').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        group.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
        pill.classList.add('active');
      });
    });
  });

  const captionEl = document.getElementById('caption');
  const dots = document.querySelectorAll('.dot');
  const img = document.getElementById('slideImg');
  let current = 0;
  let timer;

  function goTo(i){
    current = i;
    dots.forEach((d,idx)=> d.classList.toggle('active', idx===i));
    captionEl.style.opacity = 0;
    img.style.opacity = 0;
    setTimeout(()=>{
      img.src = slides[i].src;
      img.alt = slides[i].alt;
      captionEl.innerHTML = slides[i].caption;
      captionEl.style.opacity = 1;
      img.style.opacity = 1;
    }, 220);
  }

  function startAuto(){
    timer = setInterval(()=>{
      goTo((current+1) % slides.length);
    }, 4200);
  }
  function resetAuto(){
    clearInterval(timer);
    startAuto();
  }

  dots.forEach(dot=>{
    dot.addEventListener('click', ()=>{
      goTo(parseInt(dot.dataset.i));
      resetAuto();
    });
  });

  startAuto();
</script>
